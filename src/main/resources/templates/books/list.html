
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<h1 th:text="${title}">Catalogue</h1>

<!-- Current user and role -->
<div>
    <p>
        <strong>Logged in as:</strong>
        <span sec:authentication="name">anonymous</span>
    </p>

    <p>
        <strong>Role:</strong>
        <span sec:authentication="principal.authorities">
            ROLE_USER
        </span>
    </p>
</div>

<!-- Only ADMIN can see this link -->
<div sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/admin}">Administration</a>
</div>

<!-- Logout button -->
<form th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
</form>

<hr>

<p th:if="${message}"
   class="flash"
   th:text="${message}">
</p>

<!-- Books table -->
<table>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
</table>

</body>
</html>
